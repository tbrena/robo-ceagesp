name: Coleta CEAGESP - Pescado

on:
  schedule:
    # Horarios em UTC. Brasilia = UTC-3 o ano todo (nao ha mais horario de verao).
    #
    # Roda TODO DIA, inclusive fim de semana. A CEAGESP publica o boletim as
    # segundas, quartas e sextas, mas so o disponibiliza no site no dia seguinte
    # ("escolha a data anterior ao dia de hoje") - ou seja, o boletim de sexta so
    # aparece no sabado. Restringir a dias uteis deixava esse boletim parado ate
    # segunda-feira.
    #
    # E o horario em que o boletim entra no site varia: o de quarta 12/08 so
    # apareceu depois das 16:56 e ja estava la na madrugada de 13/08. Com apenas
    # duas execucoes por dia (09:00 e 16:00) o site ficava ate ~17h atrasado.
    # Por isso a checagem e a cada 3 horas - quando nao ha novidade a execucao
    # termina em segundos, entao o custo extra e desprezivel.
    - cron: '0 */3 * * *'  # a cada 3 horas (00:00, 03:00, ... 21:00 de Brasilia)
  workflow_dispatch:          # permite disparar manualmente pela aba Actions
    inputs:
      parametros:
        description: 'Parametros extras (ex.: --todas, --tudo, --data 03/08/2026)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write

concurrency:
  group: coleta-ceagesp
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo

    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v7

      - name: Preparar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coletar cotacoes
        env:
          PARAMETROS: ${{ inputs.parametros }}
        run: python robo_ceagesp.py $PARAMETROS

      - name: Disponibilizar planilha para download
        uses: actions/upload-artifact@v7
        with:
          name: cotacoes-pescado
          path: dados/
          if-no-files-found: warn
          retention-days: 90

      - name: Guardar os dados no repositorio
        id: gravar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados docs
          if git diff --staged --quiet; then
            echo "Nenhum boletim novo - nada a gravar."
            echo "publicou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Cotacoes CEAGESP - coleta de $(date +'%d/%m/%Y %H:%M')"
            git push
            echo "publicou=true" >> "$GITHUB_OUTPUT"
          fi

      # O push dispara sozinho o build do GitHub Pages, mas ele pode falhar por
      # conta propria: em 06/08/2026 ficou preso na fila e expirou, deixando o
      # site com dados velhos enquanto esta coleta constava como bem-sucedida.
      # Aqui esse silencio vira falha visivel (e o GitHub avisa por e-mail).
      - name: Confirmar que o site publicou
        if: steps.gravar.outputs.publicou == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(git rev-parse HEAD)
          aguardar() {
            for _ in $(seq 1 40); do
              linha=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" \
                        --jq '.status + " " + .commit' 2>/dev/null || echo "? ?")
              estado=${linha%% *}
              commit=${linha##* }
              if [ "$commit" = "$sha" ]; then
                case "$estado" in
                  built)   echo "Pages publicado a partir de ${sha:0:7}."; return 0 ;;
                  errored) echo "Build do Pages falhou para ${sha:0:7}."; return 1 ;;
                esac
              fi
              sleep 15
            done
            echo "Build do Pages nao concluiu em 10 minutos."
            return 1
          }
          sleep 20
          if aguardar; then exit 0; fi
          echo "Solicitando novo build do Pages..."
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null
          aguardar
